name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licenses and install platform
        run: |
          CMDLINE="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$CMDLINE" --licenses > /dev/null
          "$CMDLINE" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch Gradle wrapper jar
        run: |
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          ls -l gradle/wrapper/gradle-wrapper.jar

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release v1.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: "AbbasStudio v1.5"
          body: "AbbasStudio v1.5 for Android — the on-device video studio (compress, trim, convert, GIF, audio, watermark). Install the APK below."
          files: app/build/outputs/apk/debug/app-debug.apk
